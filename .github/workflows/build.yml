name: Build Windows app
on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v
      - run: python ui_check.py
      - run: python -m pip install pyinstaller==6.16.0
      - run: python -m PyInstaller --clean --noconfirm --onefile --windowed --name AptitudeCompanion --add-data "grading_prompt.txt;." app.py
      - uses: actions/upload-artifact@v4
        with:
          name: aptitude-companion-windows
          path: dist/AptitudeCompanion.exe
